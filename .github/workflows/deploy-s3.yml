name: Deploy DecodeLabs to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::017381235934:role/GitHubActions-DecodeLabs-Deploy
          aws-region: ap-south-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://decodelabs-cloud-deployment \
            --delete \
            --region ap-south-1

      - name: Verify deployment
        run: |
          aws s3 ls s3://decodelabs-cloud-deployment \
            --region ap-south-1
